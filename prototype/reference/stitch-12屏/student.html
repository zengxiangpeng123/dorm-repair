<body class="m-student">
<div class="desk">
  <aside class="brief">
    <div class="kicker">学生端 · 手机小程序</div>
    <h1>拍一张、说一句，<br><em>剩下的它自己跑。</em></h1>
    <p>不用选紧急程度，不用填楼栋寝室。进度到哪一步、师傅到没到、完工照什么样，都在这一页。</p>
    <ol id="steps">
      <li data-s="home"><b>1</b><span>首页：问候 + 当前位置 + 当前工单进度</span></li>
      <li data-s="track"><b>2</b><span>进度：所有进行中的单，按状态分组</span></li>
      <li data-s="new"><b>3</b><span>报修：只有照片和描述两个输入</span></li>
      <li data-s="detail"><b>4</b><span>详情：系统判定 + 师傅 + 处理记录</span></li>
      <li data-s="me"><b>5</b><span>我的：住宿信息自己改，系统对台账</span></li>
    </ol>
    <nav>
      <a href="student.html" class="on">学生端</a>
      <a href="worker.html">维修端</a>
      <a href="admin.html">管理端</a>
      <a href="index.html">入口</a>
    </nav>
  </aside>

  <main class="phone">
    <div id="sbar"></div>
    <div class="app">
      <header class="topbar" id="topbar"></header>
      <div class="scroll" id="scroll"></div>
      <div class="footbtn two" id="footbtn"></div>
      <nav class="tabbar" id="tabbar"></nav>
    </div>
    <div class="mask" id="mask" onclick="UI.closeSheet()"></div>
    <section class="sheet" id="sheet"></section>
    <div class="toast" id="toast"></div>
  </main>
</div>
