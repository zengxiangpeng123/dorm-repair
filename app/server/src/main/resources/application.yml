server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: dorm-repair-server
  jackson:
    default-property-inclusion: non_null
  datasource:
    # 库名、账号、密码都用环境变量可以被覆盖；本机默认 root/123456
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dorm_repair}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      pool-name: dorm-pool

# memory = 内存（单元测试用） / mysql = 正式库（默认）
app:
  store: ${APP_STORE:mysql}
  # 演示相关接口（/demo/reset、/demo/advance、/auth/system-token）只在演示模式注册
  demo: ${APP_DEMO:true}
  auth:
    # 令牌有效期（小时）。重启服务令牌就全失效，这是有意的：会话只放内存
    ttl-hours: ${APP_AUTH_TTL_HOURS:8}
    # 允许用 X-Actor-* 请求头冒充身份。只给接口测试脚本用，正式运行必须 false
    allow-header: ${APP_AUTH_ALLOW_HEADER:false}
  ai:
    # Python 定级服务，两条路两个超时，别合并成一个：
    base-url: ${AI_SERVICE_URL:http://127.0.0.1:8001}
    # 学生点提交那一步：只跑规则，毫秒级。1.5 秒还拿不到就兜底，绝不让提交卡住
    timeout-ms: ${AI_TIMEOUT_MS:1500}
    # 后台复核：真模型单次实测 2~19 秒（同一模型两次能差 10 倍），所以给 30 秒，
    # 而且跑在独立线程池里，不挂在学生的请求上
    review-timeout-ms: ${AI_REVIEW_TIMEOUT_MS:30000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 枚举存 name()：库里看到的就是 PENDING / ASSIGNED 这些词
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  # 注意：不要配 type-handlers-package。那个开关会把 DateTimeStringTypeHandler 当成
  # 全局的 String 处理器，结果 "20261118" 这种普通字符串也会被拿去 Timestamp.valueOf 解析。
  # 这个 Handler 只在 @TableField(typeHandler=...) 和 @Update 的 #{} 里显式点名使用。
  global-config:
    banner: false
    db-config:
      id-type: input

logging:
  level:
    root: INFO
    com.zxp.dormrepair: DEBUG
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{24} - %msg%n"
