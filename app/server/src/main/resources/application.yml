server:
  port: 8082
  shutdown: graceful
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:200}
    max-connections: ${SERVER_MAX_CONNECTIONS:8192}
  forward-headers-strategy: framework

spring:
  application:
    name: dorm-repair-server
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dorm_repair}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${DB_USE_SSL:false}&verifyServerCertificate=${DB_SSL_VERIFY_SERVER_CERTIFICATE:false}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      pool-name: dorm-pool

# memory = 内存（单元测试用） / mysql = 正式库（默认）
app:
  store: ${APP_STORE:mysql}
  # 演示数据与演示接口默认关闭；只有测试/演示环境显式打开。
  demo: ${APP_DEMO:false}
  bootstrap-admin:
    account: ${BOOTSTRAP_ADMIN_ACCOUNT:}
    name: ${BOOTSTRAP_ADMIN_NAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  auth:
    ttl-hours: ${APP_AUTH_TTL_HOURS:8}
    max-active-sessions: ${APP_AUTH_MAX_ACTIVE_SESSIONS:5}
    login-max-failures: ${APP_AUTH_LOGIN_MAX_FAILURES:5}
    login-block-minutes: ${APP_AUTH_LOGIN_BLOCK_MINUTES:15}
    login-source-max-failures: ${APP_AUTH_LOGIN_SOURCE_MAX_FAILURES:20}
    session-cleanup-minutes: ${APP_AUTH_SESSION_CLEANUP_MINUTES:60}
    # 仅测试脚本允许 X-Actor-*；生产 profile 会拒绝该开关。
    allow-header: ${APP_AUTH_ALLOW_HEADER:false}
  order:
    auto-assign: ${APP_ORDER_AUTO_ASSIGN:true}
  idempotency:
    claim-timeout-minutes: ${APP_IDEMPOTENCY_CLAIM_TIMEOUT_MINUTES:10}
  file:
    storage: ${APP_FILE_STORAGE:local}
    metadata: ${APP_FILE_METADATA:mysql}
    # 仅旧测试/演示数据可开启；生产必须为 false，新照片只能走上传接口。
    allow-legacy-demo-urls: ${APP_FILE_ALLOW_LEGACY_DEMO_URLS:false}
    local-root: ${APP_FILE_LOCAL_ROOT:./data/uploads}
    cleanup:
      retention-hours: ${APP_FILE_CLEANUP_RETENTION_HOURS:24}
      batch-size: ${APP_FILE_CLEANUP_BATCH_SIZE:100}
      claim-timeout-minutes: ${APP_FILE_CLEANUP_CLAIM_TIMEOUT_MINUTES:30}
    s3:
      endpoint: ${APP_FILE_S3_ENDPOINT:}
      region: ${APP_FILE_S3_REGION:us-east-1}
      bucket: ${APP_FILE_S3_BUCKET:}
      access-key: ${APP_FILE_S3_ACCESS_KEY:}
      secret-key: ${APP_FILE_S3_SECRET_KEY:}
      session-token: ${APP_FILE_S3_SESSION_TOKEN:}
      path-style: ${APP_FILE_S3_PATH_STYLE:false}
  ai:
    base-url: ${AI_SERVICE_URL:http://127.0.0.1:8001}
    model: ${AI_MODEL:raccoon/sn-deepseek-v4-1-flash-1017}
    provider: ${AI_PROVIDER:agent2api}
    timeout-ms: ${AI_TIMEOUT_MS:1500}
    review-timeout-ms: ${AI_REVIEW_TIMEOUT_MS:30000}
    review-claim-timeout-minutes: ${AI_REVIEW_CLAIM_TIMEOUT_MINUTES:30}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: input

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,fileStorage
  metrics:
    tags:
      application: dorm-repair-server
  info:
    env:
      enabled: true

info:
  app:
    name: dorm-repair-server
    version: 1.0.0

logging:
  level:
    root: INFO
    com.zxp.dormrepair: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{24} - %msg%n"
