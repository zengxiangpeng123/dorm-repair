server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: dorm-repair-server
  jackson:
    default-property-inclusion: non_null
  datasource:
    # 库名、账号、密码都用环境变量可以被覆盖；本机默认 root/123456
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dorm_repair}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      pool-name: dorm-pool

# memory = 内存（单元测试用，默认） / mysql = 正式库
app:
  store: ${APP_STORE:mysql}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 枚举存 name()：库里看到的就是 PENDING / ASSIGNED 这些词
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  # 注意：不要配 type-handlers-package。那个开关会把 DateTimeStringTypeHandler 当成
  # 全局的 String 处理器，结果 "20261118" 这种普通字符串也会被拿去 Timestamp.valueOf 解析。
  # 这个 Handler 只在 @TableField(typeHandler=...) 和 @Update 的 #{} 里显式点名使用。
  global-config:
    banner: false
    db-config:
      id-type: input

logging:
  level:
    root: INFO
    com.zxp.dormrepair: DEBUG
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{24} - %msg%n"
