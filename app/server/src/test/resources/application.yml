# 测试配置：一律用内存仓库，跑 mvn test 不需要 MySQL 在跑
# DataSource 只是为了让 MyBatis-Plus 的自动配置能起来；Hikari 是懒连接，测试全程不会真的连库
app:
  store: memory
  demo: true
  auth:
    # 已有 20 个用例用 X-Actor-* 头模拟身份，这里放行；AuthTest 会单独关掉它验证真令牌
    allow-header: true
    ttl-hours: 1

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dorm_repair?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 1000
      maximum-pool-size: 2

logging:
  level:
    root: WARN
    com.zxp.dormrepair: INFO
