app:
  store: memory
  demo: true
  order:
    auto-assign: false
  file:
    storage: memory
    metadata: memory
    allow-legacy-demo-urls: true
    local-root: ./target/test-uploads
  auth:
    allow-header: true
    ttl-hours: 1

spring:
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/dorm_repair?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 1000
      maximum-pool-size: 2

logging:
  level:
    root: WARN
    com.zxp.dormrepair: INFO
