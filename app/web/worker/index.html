<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12294B">
<title>工作台 · 宿舍维修</title>
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/worker.css">
</head>
<body data-app="worker">
<div class="stage">
  <header class="top">
    <div id="who" class="who"></div>
    <h1 id="hi">师傅</h1>
    <div class="sub" id="loc">—</div>
    <div class="tally" id="tally"></div>
  </header>

  <main class="body" id="main"><div class="empty">加载中…</div></main>
</div>

<script src="/assets/app.js"></script>
<script>
(async function () {
  let meta, user;
  try { ({ meta, user } = await App.start('worker')); }
  catch (e) { document.body.innerHTML = '<div class="empty">启动失败：' + App.esc(App.explainErr(e)) + '</div>'; return; }

  const bName = (meta.buildings.find(b => b.id === user.building) || {}).name || '本楼';
  App.$('#hi').textContent = user.name + ' · ' + (user.team || '维修班');
  App.$('#loc').textContent = bName + (user.building ? '' : ' · 未排班');
  App.$('#who').innerHTML = App.whoBar('worker', user);
  App.bindWho(document, 'worker');
  App.nav('worker', 'index.html');

  const main = App.$('#main');
  const toGo = o => ({ REPAIRING: '接着修这间', ASSIGNED: '到门打卡，开始修', PARTS: '看缺什么件', PENDING: '还没派工' }[o.status] || '打开这单');

  async function load() {
    let d;
    try { d = await App.api.get('/worker/todo', { role: 'worker' }); }
    catch (e) { main.innerHTML = `<div class="empty">${App.esc(App.explainErr(e))}</div>`; return; }

    const b = d.buildings[0];
    if (!b) {
      App.$('#tally').innerHTML = '';
      main.innerHTML = `<div class="empty"><div class="big">今天没有派给你的单</div>本楼有单会自动派过来</div>`;
      return;
    }

    const s = d.summary || {};
    App.$('#tally').innerHTML = `
      <div class="t ${s.todo ? 'hot' : ''}"><b>${s.todo || 0}</b><span>待我上门</span></div>
      <div class="t"><b>${s.repairing || 0}</b><span>正在修</span></div>
      <div class="t"><b>${s.parts || 0}</b><span>等配件</span></div>
      <div class="t"><b>${b.progress.done}/${b.progress.total}</b><span>本楼已完</span></div>`;

    const rank = { REPAIRING: 0, ASSIGNED: 1, PARTS: 2 };
    const list = b.orders.slice().sort((x, y) => (rank[x.status] ?? 9) - (rank[y.status] ?? 9) || y.floor - x.floor);
    const next = list[0];
    const rest = list.slice(1);

    main.innerHTML = `
      ${next ? hero(next, b) : ''}

      <div class="list-h"><b>这一栋</b><span>还剩 ${rest.length} 间，按楼层从上往下走</span><div class="grow"></div></div>
      ${rest.length ? rest.map(o => qrow(o)).join('') : `<div class="empty" style="padding:28px 20px">这一栋就剩手上这一间</div>`}

      <div class="tip" data-tone="info">打卡是<b>一次算一批</b>：在楼下点一次，本楼待上门的单一起转维修中，系统按这个时间开始算你的到场。</div>
    `;

    const btnArrive = App.$('#btnArrive');
    if (btnArrive) btnArrive.addEventListener('click', async (ev) => {
      const btn = ev.currentTarget;
      btn.disabled = true; btn.textContent = '打卡中…';
      try {
        const r = await App.api.post('/buildings/' + encodeURIComponent(user.building) + '/arrive', {}, { role: 'worker' });
        App.toast(r.ok.length
          ? `已打卡，${r.ok.length} 单转维修中${r.skipped.length ? `（${r.skipped.length} 单本来就在修）` : ''}`
          : '打了卡，但没有待上门的单');
        await load();
      } catch (e) {
        App.toast(App.explainErr(e), 'bad');
        btn.disabled = false; btn.textContent = '进楼打卡 · ' + bName;
      }
    });
  }

  /* 下一间：全屏唯一的主角 */
  const shortWin = w => String(w || '').split(/[（(]/)[0];

  function hero(o, b) {
    const cta = b.arrived
      ? `<a class="cta" href="task.html?no=${encodeURIComponent(o.no)}">${App.esc(toGo(o))}</a>`
      : `<button class="cta" id="btnArrive">进楼打卡 · ${App.esc(b.buildingName)}</button>`;
    return `<section class="hero">
      <div class="row1">
        <div class="plate lg" data-st="${App.esc(o.status)}"><b>${App.esc(o.room)}</b><span>${o.floor}F 室</span></div>
        <div class="rm">
          <div class="kicker">下一间<span class="lv" data-l="${App.esc(o.level)}">${App.esc(o.level)}</span></div>
          <p class="fault">${App.esc(o.desc)}</p>
        </div>
      </div>
      <div class="meta">
        <i>${App.esc(o.category)}</i><i>可上门 ${App.esc(shortWin(o.window))}</i><i>${App.esc(o.student.name)}</i><i class="no">${App.esc(o.no)}</i>
      </div>
      <div class="cta-wrap">
        ${cta}
        <a class="cta ghost" href="building.html">看这一栋剩下的 ${b.progress.total - b.progress.done} 间</a>
      </div>
    </section>`;
  }

  function qrow(o) {
    return `<a class="qrow" data-st="${App.esc(o.status)}" href="task.html?no=${encodeURIComponent(o.no)}">
      <div class="plate" data-st="${App.esc(o.status)}"><b>${App.esc(o.room)}</b><span>${o.floor}F</span></div>
      <div class="tx">
        <div class="d">${o.level === '紧急' ? '<em class="hot">紧急</em>' : ''}${App.esc(o.desc)}</div>
        <div class="m"><span>${App.esc(o.category)}</span><span>${App.esc(shortWin(o.window))}</span>${o.parts ? `<span>缺件 ${App.esc(o.parts.name)}</span>` : ''}</div>
      </div>
      <span class="st">${App.esc(o.statusLabel)}</span>
    </a>`;
  }

  await load();
})();
</script>
</body>
</html>
