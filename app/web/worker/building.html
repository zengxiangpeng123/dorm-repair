<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12294B">
<title>本楼清单 · 宿舍维修</title>
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/worker.css">
</head>
<body data-app="worker">
<div class="stage">
  <header class="top">
    <div id="who" class="who"></div>
    <h1 id="bn">本楼</h1>
    <div class="sub" id="sub">—</div>
    <div class="tally" id="tally"></div>
  </header>

  <main class="body" id="main"><div class="empty">加载中…</div></main>
</div>

<script src="/assets/app.js"></script>
<script>
(async function () {
  let meta, user;
  try { ({ meta, user } = await App.start('worker')); }
  catch (e) { document.body.innerHTML = '<div class="empty">启动失败：' + App.esc(App.explainErr(e)) + '</div>'; return; }

  const bName = (meta.buildings.find(b => b.id === user.building) || {}).name || '本楼';
  App.$('#bn').textContent = bName;
  App.$('#who').innerHTML = App.whoBar('worker', user);
  App.bindWho(document, 'worker');
  App.nav('worker', 'building.html');

  const main = App.$('#main');
  const WALK = ['PENDING', 'ASSIGNED', 'REPAIRING', 'PARTS'];

  async function load() {
    let d;
    try { d = await App.api.get('/buildings/' + encodeURIComponent(user.building) + '/board', { role: 'worker' }); }
    catch (e) { main.innerHTML = `<div class="empty">${App.esc(App.explainErr(e))}</div>`; return; }

    const allFloors = d.floors || [];
    const all = allFloors.flatMap(f => f.orders);
    const arrived = all.some(o => o.arriveAt);
    const orders = all.filter(o => WALK.includes(o.status));
    const rest = all.length - orders.length;
    const floors = allFloors
      .map(f => ({ floor: f.floor, orders: f.orders.filter(o => WALK.includes(o.status)) }))
      .filter(f => f.orders.length);
    const empty = (d.emptyFloors || []);

    App.$('#sub').textContent = '本楼清单 · ' + (arrived ? '已在楼内' : '还没进楼') + ' · 要上楼 ' + orders.length + ' 单';
    const maxF = floors.length ? Math.max(...floors.map(f => f.floor)) : null;
    App.$('#tally').innerHTML = `
      <div class="t ${orders.length ? 'hot' : ''}"><b>${orders.length}</b><span>要上楼</span></div>
      <div class="t"><b>${floors.length}</b><span>层要跑</span></div>
      <div class="t"><b>${maxF ? maxF + 'F' : '—'}</b><span>从这层开始</span></div>`;

    if (!orders.length) {
      main.innerHTML = `<div class="empty"><div class="big">本楼没有要上楼的活</div>
        ${rest ? `另有 ${rest} 单在等学生验收或返修，不用跑。` : '下一单派过来会显示在这儿'}</div>`;
      return;
    }

    main.innerHTML = `
      ${arrived ? '' : `<div class="tip" data-tone="warn">还没进楼打卡。到楼下先打一次，本楼待上门的单一起转维修中——系统按这个时间算到场。</div>`}

      ${floors.map(f => {
        const cnt = {};
        f.orders.forEach(o => { cnt[o.statusLabel] = (cnt[o.statusLabel] || 0) + 1; });
        const cl = Object.keys(cnt).map(k => `${k} ${cnt[k]}`).join(' · ');
        return `
        <div class="floor-strip"><b>${f.floor}F</b><span>${f.orders.length} 间</span><div class="grow"></div>
          <span>${cl}</span></div>
        ${f.orders.map(o => `<a class="qrow" data-st="${App.esc(o.status)}" href="task.html?no=${encodeURIComponent(o.no)}">
          <div class="plate" data-st="${App.esc(o.status)}"><b>${App.esc(o.room)}</b><span>${f.floor}F</span></div>
          <div class="tx">
            <div class="d">${o.level === '紧急' ? '<em class="hot">紧急</em>' : ''}${App.esc(o.desc)}</div>
            <div class="m"><span>${App.esc(o.category)}</span><span>${App.esc(String(o.window || '').split(/[（(]/)[0])}</span>${o.parts ? `<span>缺件 ${App.esc(o.parts.name)}</span>` : ''}${o.cancelRequest ? '<span class="warn">学生申请撤销</span>' : ''}</div>
          </div>
          <span class="st">${App.esc(o.statusLabel)}</span>
        </a>`).join('')}`;
      }).join('')}

      ${empty.length ? `<div class="floor-strip"><span>${empty.map(f => f + 'F').join('、')} 本层没有单，不用上去</span></div>` : ''}
      ${rest ? `<div class="floor-strip"><span>另有 ${rest} 单在等学生验收或返修，不用上楼</span></div>` : ''}

      <div class="tip" data-tone="info">从上往下跑：楼层已经排好，一层跑完再下一层，少爬两趟楼梯。点任意一间就是这单的作业页。</div>

      ${arrived ? '' : `<div class="dock"><button class="cta" id="btnArrive">进楼打卡 · ${App.esc(bName)}</button></div>`}
    `;

    const btn = App.$('#btnArrive');
    if (btn) btn.addEventListener('click', async () => {
      btn.disabled = true; btn.textContent = '打卡中…';
      try {
        const r = await App.api.post('/buildings/' + encodeURIComponent(user.building) + '/arrive', {}, { role: 'worker' });
        App.toast(`已打卡 ${r.ok.length} 单${r.skipped.length ? `，${r.skipped.length} 单本来就在修` : ''}`);
        await load();
      } catch (e) { App.toast(App.explainErr(e), 'bad'); btn.disabled = false; btn.textContent = '进楼打卡 · ' + bName; }
    });
  }

  await load();
})();
</script>
</body>
</html>
