<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12294B">
<title>等配件 · 宿舍维修</title>
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/worker.css">
<style>
  /* 这一页特有的：钱和日期要像单据一样对齐 */
  .pmoney {
    display: grid;
    grid-template-columns: 1.1fr 1fr 1.2fr;
    gap: 1px;
    background: var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 11px;
  }
  .pmoney > div { background: #fff; padding: 9px 11px 10px; }
  .pmoney dt { font-size: 11px; color: var(--ink-3); margin-bottom: 3px; }
  .pmoney dd {
    margin: 0;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }
  .pmoney dd.over { color: var(--o-ink); }
</style>
</head>
<body data-app="worker">
<div class="stage">
  <header class="top">
    <h1><a class="back" href="index.html" aria-label="返回工作台">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a><span>等配件</span></h1>
    <div class="sub" id="sub">—</div>
    <div class="tally" id="tally"></div>
  </header>

  <main class="body" id="main"><div class="empty">加载中…</div></main>
</div>

<script src="/assets/app.js"></script>
<script>
(async function () {
  let meta, user;
  try { ({ meta, user } = await App.start('worker')); }
  catch (e) { document.body.innerHTML = '<div class="empty">启动失败：' + App.esc(App.explainErr(e)) + '</div>'; return; }

  App.nav('worker', 'parts.html');
  const main = App.$('#main');

  /** 缺件是师傅登记，但"到货确认"是仓管/管理员动作。
      demo 里用管理员身份点一下，界面上写清楚是谁在收货。 */
  async function asAdmin(fn) {
    const KEY = 'hx.session.admin';
    let s = null;
    try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { }
    if (!s || !s.token) {
      const r = await App.api.post('/login', { role: 'admin', id: 'A001' });
      localStorage.setItem(KEY, JSON.stringify({ token: r.token, user: r.user }));
    }
    return fn();
  }

  async function load() {
    let d;
    try { d = await App.api.get('/worker/todo', { role: 'worker' }); }
    catch (e) { main.innerHTML = `<div class="empty">${App.esc(App.explainErr(e))}</div>`; return; }

    const parts = (d.buildings || []).flatMap(b => b.orders).filter(o => o.status === 'PARTS');
    const need = parts.filter(o => {
      const p = o.parts || {};
      return p.status === 'PENDING_APPROVAL' || String(p.amount) > meta.budgetLine;
    }).length;

    App.$('#sub').textContent = '缺件登记过的单都在这儿，到货了才回队列';

    if (!parts.length) {
      App.$('#tally').innerHTML = '';
      main.innerHTML = `<div class="empty"><div class="big">没有在等件的单</div>你登记过的缺件会出现在这儿</div>`;
      return;
    }

    const eta = parts.map(o => (o.parts || {}).etaDate).filter(Boolean).sort()[0];
    App.$('#tally').innerHTML = `
      <div class="t ${parts.length ? 'hot' : ''}"><b>${parts.length}</b><span>单在等件</span></div>
      <div class="t"><b>${need}</b><span>要等人批</span></div>
      <div class="t"><b>${eta ? eta.slice(5) : '—'}</b><span>最早到货</span></div>`;

    main.innerHTML = `
      ${parts.map(o => {
        const p = o.parts || {};
        const over = p.status === 'PENDING_APPROVAL' || String(p.amount) > meta.budgetLine;
        return `<section class="hero">
          <div class="row1">
            <div class="plate" data-st="PARTS"><b>${App.esc(o.room)}</b><span>${o.floor}F</span></div>
            <div class="rm">
              <div class="kicker">${App.esc(p.name || '缺件')}<span class="lv" data-l="${over ? '较急' : '普通'}">${over ? '等人批' : '已下单'}</span></div>
              <p class="fault">${App.esc(o.desc)}</p>
              <div class="meta"><i>${App.esc(o.building)}</i><i>${App.esc(o.no)}</i></div>
            </div>
          </div>

          <dl class="pmoney">
            <div><dt>金额</dt><dd class="${over ? 'over' : ''}">¥${App.esc(p.amount ?? '—')}</dd></div>
            <div><dt>预计到货</dt><dd>${App.esc(p.etaDate ? p.etaDate.slice(5) : '—')}</dd></div>
            <div><dt>预算线</dt><dd>¥${meta.budgetLine}</dd></div>
          </dl>

          <div class="why"><em>${over ? '超预算' : '预算内'}</em>${over
            ? `线是 ${meta.budgetLine} 元，这单 ¥${App.esc(p.amount)} 已经进管理端「例外清单」，事后抽查就查这一条；货到了账也一直留到归档。`
            : `线内不用人批，直接下单。到货后这单回队列重新派给你，紧急度不降。`}</div>

          <div class="cta-wrap">
            <button class="cta" data-arrive="${App.esc(o.no)}">到货了，确认收货</button>
            <a class="cta ghost" href="task.html?no=${encodeURIComponent(o.no)}">看这单详情</a>
          </div>
        </section>`;
      }).join('')}

      <div class="tip" data-tone="info">为什么让你填金额：填了系统才能自动跟 ${meta.budgetLine} 元预算线比，不用另外找人签字；这也是事后抽查时唯一能对上的数。到货确认是仓管点的，你在这儿点一下等于替仓管确认。</div>
    `;

    main.querySelectorAll('[data-arrive]').forEach(b => b.addEventListener('click', async () => {
      const no = b.dataset.arrive;
      b.disabled = true; b.textContent = '确认中…';
      try {
        await asAdmin(() => App.api.post('/orders/' + encodeURIComponent(no) + '/parts-arrived', {}, { role: 'admin' }));
        App.toast('已确认到货，这单回队列了');
        await load();
      } catch (e) { App.toast(App.explainErr(e), 'bad'); b.disabled = false; b.textContent = '到货了，确认收货'; }
    }));
  }

  await load();
})();
</script>
</body>
</html>
