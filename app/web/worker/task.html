<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16305A">
<title>单间作业 · 宿舍维修</title>
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/worker.css">
</head>
<body data-app="worker">
<div class="stage">
  <header class="top">
    <div id="who" class="who"></div>
    <h1><a class="back" href="building.html" aria-label="返回本楼清单">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a><span id="room">—</span><span class="hchip" id="stChip"></span></h1>
    <div class="sub" id="sub">—</div>
  </header>

  <main class="body has-dock" id="main"><div class="empty">加载中…</div></main>
</div>

<script src="/assets/app.js"></script>
<script>
(async function () {
  let meta, user;
  try { ({ meta, user } = await App.start('worker')); }
  catch (e) { document.body.innerHTML = '<div class="empty">启动失败：' + App.esc(App.explainErr(e)) + '</div>'; return; }

  App.nav('worker', 'task.html');
  const main = App.$('#main');
  let no = new URLSearchParams(location.search).get('no');

  const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3"/></svg>';

  /** 没带单号就自己挑一张：正在修的 > 待上门的 > 待配件的 */
  async function pick() {
    const d = await App.api.get('/worker/todo', { role: 'worker' });
    const all = (d.buildings || []).flatMap(b => b.orders);
    const rank = { REPAIRING: 0, ASSIGNED: 1, PARTS: 2, VERIFYING: 3 };
    all.sort((x, y) => (rank[x.status] ?? 9) - (rank[y.status] ?? 9) || y.floor - x.floor);
    return all[0] ? all[0].no : null;
  }

  if (!no) no = await pick();
  if (!no) { main.innerHTML = `<div class="empty"><div class="big">现在没有要做的单</div>等派工</div>`; return; }

  let o = null;
  const STEPS = { PENDING: 1, ASSIGNED: 2, REPAIRING: 3, PARTS: 3, VERIFYING: 4, DONE: 5, CLOSED: 5, CANCELLED: 0, REWORKING: 3 };

  async function load() {
    try { o = await App.api.get('/orders/' + encodeURIComponent(no), { role: 'worker' }); }
    catch (e) { main.innerHTML = `<div class="empty">${App.esc(App.explainErr(e))}</div>`; return; }

    App.$('#room').textContent = o.room + ' 室';
    App.$('#stChip').textContent = o.statusLabel;
    App.$('#sub').textContent = `${o.no}${o.reworkOf ? ' · 返修单' : ''}　${o.floor}F · ${o.category} · ${o.student.name}`;
    render();
  }

  function render() {
    main.innerHTML = [head(), cancelTip(), judge(), photos(), log(), dock()].join('');
    main.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act)));
  }

  /* 学生申请撤销：有申请才出现，一条橙线，不抢主按钮 */
  function cancelTip() {
    if (!o.cancelRequest) return '';
    return `<div class="tip" data-tone="warn"><b>学生申请撤销</b>（${App.esc(o.cancelRequest.reason)}）。要改状态得管理员批，批之前先别动手。</div>`;
  }

  function head() {
    return `<section class="hero">
      <div class="row1">
        <div class="plate lg" data-st="${App.esc(o.status)}"><b>${App.esc(o.room)}</b><span>${o.floor}F 室</span></div>
        <div class="rm">
          <div class="kicker">这间什么毛病<span class="lv" data-l="${App.esc(o.level)}">${App.esc(o.level)}</span></div>
          <p class="fault">${App.esc(o.desc)}</p>
          <div class="meta"><i>${App.esc(o.category)}</i><i>可上门 ${App.esc(o.window)}</i><i>${App.esc(o.student.name)}</i></div>
        </div>
      </div>
      ${o.ai && o.ai.basis ? `<div class="why"><em>系统判断</em>${App.esc(o.ai.basis)}</div>` : ''}
    </section>
    <div class="slab">
      <dl class="kv">
        <dt>位置</dt><dd>${App.esc(o.building)} · ${o.floor}F · ${App.esc(o.room)} 室</dd>
        <dt>报修人</dt><dd>${App.esc(o.student.name)}　可上门 ${App.esc(String(o.window || '').split(/[（(]/)[0])}</dd>
        ${o.worker ? `<dt>派给</dt><dd>${App.esc(o.worker.name)}（${App.esc(o.worker.team)}）</dd>` : ''}
      </dl>
    </div>`;
  }

  function judge() {
    const st = o.status;

    if (st === 'ASSIGNED' && !o.arriveAt) {
      return `<div class="slab">
        <div class="h"><b>能进场吗</b><div class="grow"></div><span>到了门口再点</span></div>
        <div class="kv"><dt>说明</dt><dd>门开着、学生在，就点下面的按钮开始修；没人在就选原因，这单重排回队列，不算你的问题。</dd></div>
      </div>`;
    }

    if (st === 'REPAIRING') {
      return `<div class="slab">
        <div class="h"><b>能当场修好吗</b><div class="grow"></div><span>修完点上报</span></div>
        <div class="kv"><dt>说明</dt><dd>修好了就传完工照，至少 1 张；缺件先登记名称、金额、到货日，金额会自己跟预算线比。</dd></div>
      </div>`;
    }

    if (st === 'PARTS') {
      const p = o.parts || {};
      return `<div class="slab">
        <div class="h"><b>等配件</b><div class="grow"></div><span>${p.status === 'PENDING_APPROVAL' ? '等管理员批' : '已下单'}</span></div>
        <dl class="kv">
          <dt>配件</dt><dd>${App.esc(p.name || '—')}</dd>
          <dt>金额</dt><dd class="no">¥ ${App.esc(p.amount ?? '—')}${Number(p.amount) > meta.budgetLine ? '　超预算线' : ''}</dd>
          <dt>到货</dt><dd class="no">${App.esc(p.etaDate || '—')}</dd>
        </dl>
        <div class="why"><em>规则</em>到货后这单回队列重新派给你，紧急度不降。</div>
      </div>`;
    }

    const txt = {
      VERIFYING: ['等学生验收', `已经上报完工，学生签字就结束。超过 ${meta.verifyHours} 小时没人管，系统自动验收。`],
      DONE: ['学生已签字', '到归档时间系统自己归档，你不用管。'],
      CLOSED: ['已归档', '这单转只读了。'],
      CANCELLED: ['已取消', '学生撤了，不用去。'],
      REWORKING: ['返修中', `验收没过，返修单 ${App.esc(o.reworkNo || '')} 会重新派过来。`],
      PENDING: ['还没派到这单', '等系统派工。']
    }[st];
    if (!txt) return '';
    return `<div class="slab"><div class="h"><b>${txt[0]}</b></div><div class="kv"><dt>说明</dt><dd>${App.esc(txt[1])}</dd></div></div>`;
  }

  function photos() {
    const before = o.photosBefore || [], after = o.photosAfter || [];
    const needAfter = ['VERIFYING', 'DONE', 'CLOSED'].includes(o.status) && !after.length;
    return `<div class="slab">
      <div class="h"><b>照片</b><div class="grow"></div><span>${before.length} 张现场 · ${after.length} 张完工</span></div>
      <div class="shots">
        ${before.map((p, i) => `<div class="s has">${CAM}现场 ${i + 1}</div>`).join('') || '<div class="s">没有现场照</div>'}
        ${after.map((p, i) => `<div class="s has">${CAM}完工 ${i + 1}</div>`).join('') ||
          (needAfter ? '<div class="s" data-miss>缺完工照</div>' : `<div class="s">${CAM}还没传</div>`)}
      </div>
    </div>`;
  }

  function log() {
    const evs = (o.events || []).slice().sort((a, b) => a.seq - b.seq).slice(-5);
    return `<div class="slab">
      <div class="h"><b>这单经过</b><div class="grow"></div><a href="building.html" style="color:var(--ink-3);text-decoration:none;font-size:12px">回本楼</a></div>
      <div class="trail">
        ${evs.map(e => `<div class="e">
          <b>${App.esc(App.EVENT_CN[e.event] || e.event)}</b>
          <span>${App.esc(String(e.at).slice(5, 16))} · ${App.esc(e.actorName || '')}${e.manual === 0 ? ' · 系统自动' : ''}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }

  function dock() {
    const st = o.status;
    if (st === 'ASSIGNED' && !o.arriveAt) {
      return `<div class="dock">
        <button class="cta" data-act="arrive">门开着，进去开工</button>
        <button class="cta ghost" data-act="noshow">敲门没人应</button>
      </div>`;
    }
    if (st === 'REPAIRING') {
      return `<div class="dock">
        <button class="cta" data-act="finish">修好了，传完工照</button>
        <button class="cta ghost" data-act="parts">缺件，先登记</button>
      </div>`;
    }
    if (st === 'PARTS') {
      return `<div class="dock"><a class="cta ghost" href="parts.html">到货了，确认收货</a></div>`;
    }
    return '';
  }

  /* ---------------- 动作 ---------------- */

  async function act(name) {
    if (name === 'arrive') {
      try {
        await App.api.post('/orders/' + encodeURIComponent(no) + '/arrive', { version: o.version }, { role: 'worker' });
        App.toast('已打卡，开始修');
        await load();
      } catch (e) { App.toast(App.explainErr(e), 'bad'); }
      return;
    }

    if (name === 'noshow') {
      const s = App.sheet({
        title: '没人在，选个原因',
        sub: '选了之后这单重排回队列，不算你的问题。',
        body: `<div style="display:grid;gap:8px">
          ${meta.noShowReasons.map(r => `<button class="cta ghost" data-r="${r.code}">${App.esc(r.label)}</button>`).join('')}
        </div>`
      });
      s.el.addEventListener('click', async ev => {
        const b = ev.target.closest('[data-r]');
        if (!b) return;
        try {
          await App.api.post('/orders/' + encodeURIComponent(no) + '/no-show',
            { reason: b.dataset.r, version: o.version }, { role: 'worker' });
          s.close(); App.toast('已记录，这单重排'); await load();
        } catch (e) { App.toast(App.explainErr(e), 'bad'); }
      });
      return;
    }

    if (name === 'finish') openFinish();
    if (name === 'parts') openParts();
  }

  function openFinish() {
    const tags = meta.finishTags.map(t => `<label><input type="checkbox" value="${App.esc(t)}"><span>${App.esc(t)}</span></label>`).join('');
    const s = App.sheet({
      title: '上报完工',
      sub: '完工照必填 1 张，处理说明点一下就行，不用打字。',
      body: `
        <div class="uploader" id="up" style="margin-bottom:12px">
          ${CAM}<div><b>拍完工照</b><div class="sk">必填</div></div><div class="grow"></div><span class="cnt" id="upCnt"></span>
        </div>
        <div class="thumbs" id="upThumbs" style="margin-bottom:12px"></div>
        <div class="sk" style="margin-bottom:8px">做了什么</div>
        <div class="chips" id="tags">${tags}</div>
        <textarea class="input" id="note" rows="2" placeholder="补充一句（选填）" style="margin-top:12px"></textarea>
        <button class="cta" style="margin-top:12px" data-x="ok">上报完工</button>`
    });

    const shots = [];
    const up = App.$('#up', s.el);
    up.addEventListener('click', () => {
      if (shots.length >= 3) return App.toast('最多 3 张');
      shots.push('demo://after/' + Date.now() + '-' + shots.length);
      App.$('#upCnt', s.el).textContent = shots.length + ' 张';
      App.$('#upThumbs', s.el).innerHTML = shots.map((p, i) => `<div class="ph ok">${CAM}完工照 ${i + 1}</div>`).join('');
    });

    s.el.addEventListener('click', async ev => {
      if (!ev.target.closest('[data-x="ok"]')) return;
      const picked = App.$$('#tags input:checked', s.el).map(i => i.value);
      try {
        await App.api.post('/orders/' + encodeURIComponent(no) + '/finish', {
          photoUrls: shots, noteTags: picked,
          note: App.$('#note', s.el).value.trim(), version: o.version
        }, { role: 'worker' });
        s.close();
        App.toast('已上报，等学生验收');
        await load();
      } catch (e) { App.toast(App.explainErr(e), 'bad'); }
    });
  }

  function openParts() {
    const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
    const s = App.sheet({
      title: '要申请配件',
      sub: `填名称、金额、到货日。超过预算线 ${meta.budgetLine} 元会转管理端审批。`,
      body: `
        <input class="input" id="pName" placeholder="配件名称，例：软管 ×2" style="margin-bottom:10px">
        <input class="input" id="pAmt" type="number" inputmode="decimal" placeholder="金额（元）" style="margin-bottom:10px">
        <input class="input" id="pEta" type="date" value="${tomorrow}" style="margin-bottom:10px">
        <div class="tip" id="pTip" data-tone="info" style="margin:0"><b>预算线 ${meta.budgetLine} 元</b>，线内直接下单。</div>
        <button class="cta" style="margin-top:12px" data-x="ok">提交缺件</button>`
    });

    const amt = App.$('#pAmt', s.el);
    amt.addEventListener('input', () => {
      const v = Number(amt.value || 0);
      const tip = App.$('#pTip', s.el);
      if (!v) { tip.setAttribute('data-tone', 'info'); tip.innerHTML = `<b>预算线 ${meta.budgetLine} 元</b>，线内直接下单。`; return; }
      const over = v > meta.budgetLine;
      tip.setAttribute('data-tone', over ? 'warn' : 'info');
      tip.innerHTML = over
        ? `<b>${v} 元超了 ${meta.budgetLine} 元预算线</b>，提交后这单进管理端例外清单，等人批。`
        : `${v} 元在预算线内，提交后直接下单，不用人批。`;
    });

    s.el.addEventListener('click', async ev => {
      if (!ev.target.closest('[data-x="ok"]')) return;
      try {
        const r = await App.api.post('/orders/' + encodeURIComponent(no) + '/need-parts', {
          name: App.$('#pName', s.el).value.trim(),
          amount: Number(App.$('#pAmt', s.el).value),
          etaDate: App.$('#pEta', s.el).value,
          version: o.version
        }, { role: 'worker' });
        s.close();
        App.toast(r.overBudget ? '已提交，超预算，等管理端批' : '已下单，等到货');
        await load();
      } catch (e) { App.toast(App.explainErr(e), 'bad'); }
    });
  }

  await load();
})();
</script>
</body>
</html>
