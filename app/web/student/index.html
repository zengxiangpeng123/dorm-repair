<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>我的报修 · 宿舍维修</title>
<link rel="stylesheet" href="/assets/ui.css">
</head>
<body>
<div class="stage">
  <header class="top">
    <div>
      <h1 id="hi">同学</h1>
      <div class="sub" id="loc">—</div>
    </div>
    <div class="grow"></div>
    <div id="who"></div>
  </header>

  <main class="body">
    <div id="now"></div>

    <a href="new.html" class="btn primary big block" style="margin-top:14px">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      我要报修
    </a>
    <div class="sk" style="text-align:center;margin-top:8px">拍一张、写一句，剩下的系统自己跑</div>

    <div class="section-t"><b>最近的单</b><span id="cnt"></span><div style="flex:1"></div><a href="list.html" style="color:var(--brand);text-decoration:none">全部 ›</a></div>
    <div id="list"></div>
  </main>
</div>

<script src="/assets/app.js"></script>
<script>
(async function () {
  let meta, user;
  try { ({ meta, user } = await App.start('student')); }
  catch (e) { document.body.innerHTML = '<div class="empty">启动失败：' + App.esc(App.explainErr(e)) + '</div>'; return; }

  App.$('#hi').textContent = user.name;
  App.$('#loc').textContent = (meta.buildings.find(b => b.id === user.building) || {}).name
    ? (meta.buildings.find(b => b.id === user.building).name + ' ' + (user.room || ''))
    : '还没绑定寝室';
  App.$('#who').innerHTML = App.whoBar('student', user);
  App.bindWho(document, 'student');
  App.nav('student', 'index.html');

  let timer = null;

  async function load() {
    const active = await App.api.get('/my/orders?status=ACTIVE', { role: 'student' });
    const all = await App.api.get('/my/orders?status=ALL&pageSize=50', { role: 'student' });

    App.$('#cnt').textContent = all.total ? `共 ${all.total} 单` : '';

    // 当前在跑的单：取最新一张
    const cur = active.items[0];
    const box = App.$('#now');
    if (!cur) {
      box.innerHTML = `<div class="card"><div class="pd" style="text-align:center;padding:26px 16px">
        <div style="font-size:15px;margin-bottom:6px">现在没有在跑的单</div>
        <div class="sk">上次那张已经归档了。有事再报一张。</div></div></div>`;
    } else {
      box.innerHTML = `
        <div class="card">
          <div class="hd">
            <h2>当前这单</h2><div class="grow"></div>
            ${App.statusPill(cur.status)}
          </div>
          <a class="pd" href="detail.html?no=${encodeURIComponent(cur.no)}" style="display:block;text-decoration:none;color:inherit">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
              <span class="no sk">${App.esc(cur.no)}</span><div style="flex:1"></div>
              ${App.levelPill(cur.level)}
            </div>
            <div style="font-size:15.5px;line-height:1.45">${App.esc(cur.desc)}</div>
            <div style="margin:14px 0 6px">${App.steps(cur)}</div>
            <div class="sk">${App.esc(cur.building)} ${App.esc(cur.room)}　${App.esc(cur.category)}　可上门：${App.esc(cur.window)}</div>
            ${timerCard(cur)}
          </a>
          <div class="ft">${cur.worker ? `师傅 ${App.esc(cur.worker.name)}（${App.esc(cur.worker.team || '')}）` : '还没派工，系统按楼栋自动排'}</div>
        </div>`;
      startTick();
    }

    const rest = all.items.filter(o => !cur || o.no !== cur.no).slice(0, 4);
    App.$('#list').innerHTML = rest.length ? rest.map(ticket).join('')
      : `<div class="empty"><div class="big">还没有别的单</div>报修之后这里会按时间排开</div>`;
  }

  function ticket(o) {
    return `<a class="ticket" data-st="${App.esc(o.status)}" href="detail.html?no=${encodeURIComponent(o.no)}">
      <div class="l1"><span class="no">${App.esc(o.no)}</span><div class="grow"></div>${App.statusPill(o.status)}</div>
      <div class="d">${App.esc(o.desc)}</div>
      <div class="m">
        <span>${App.esc(o.room)} 室</span><span class="dot">·</span>
        <span>${App.esc(o.category)}</span><span class="dot">·</span>
        <span>${App.when(o.createdAt)}</span>
      </div>
    </a>`;
  }

  function timerCard(o) {
    const t = o.timers && o.timers.t1;
    if (!t) return '';
    const tone = t.leftMs < 24 * App.HOUR ? 'danger' : (t.leftMs < 72 * App.HOUR ? 'warn' : '');
    return `<div class="timer" data-tone="${tone}" style="margin-top:12px" data-deadline="${App.parse(t.deadline)}">
      <div class="grow"><div class="lb">${App.esc(t.label)} · 还剩</div><div class="big" data-left>${App.short(t.leftMs)}</div></div>
      <div style="text-align:right"><div class="lb">截止</div><div class="sk">${App.when(t.deadline)}</div></div>
    </div>
    <div class="sk" style="margin-top:6px">超时系统自动验收，不用你操作</div>`;
  }

  function startTick() {
    clearInterval(timer);
    timer = setInterval(() => {
      App.$$('[data-deadline]').forEach(el => {
        const left = +el.getAttribute('data-deadline') - Date.now();
        const t = App.$('[data-left]', el);
        if (t) t.textContent = App.short(left);
        el.setAttribute('data-tone', left < 0 ? 'danger' : '');
      });
    }, 1000);
  }

  await load();
})();
</script>
</body>
</html>
