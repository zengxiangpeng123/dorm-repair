<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>报修 · 宿舍维修</title>
<link rel="stylesheet" href="/assets/ui.css">
</head>
<body>
<div class="stage">
  <header class="top">
    <a class="back" href="index.html" aria-label="返回">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div><h1>报修</h1><div class="sub" id="loc">—</div></div>
  </header>

  <main class="body" style="padding-bottom:104px">
    <div class="card">
      <div class="hd"><h2>现场照片</h2><div class="grow"></div><span class="sk" id="phCnt">没拍</span></div>
      <div class="pd">
        <div class="uploader" id="up">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>
          <div><b>拍一张</b></div>
          <div class="sk">必填 · 最多 3 张</div>
        </div>
        <div class="thumbs" id="thumbs"></div>
        <div class="sk" id="phHint" style="margin-top:8px;color:var(--danger)">还没有照片，先拍一张再提交</div>
      </div>
    </div>

    <div class="card">
      <div class="hd"><h2>哪里坏了、怎么坏的</h2><div class="grow"></div><span class="sk" id="dCnt">0 / 200</span></div>
      <div class="pd">
        <textarea class="input" id="desc" rows="4" maxlength="200"
          placeholder="例：洗手盆下面的软管一直滴水，拿桶接着，快接满了"></textarea>
        <div class="sk" style="margin-top:8px">写清楚位置和现象就行，不用挑毛病属于哪一类。</div>
      </div>
    </div>

    <div class="card">
      <div class="hd"><h2>什么时候寝室有人</h2></div>
      <div class="pd">
        <div class="chips" id="win">
          <label><input type="radio" name="win" value="全天" checked><span>全天都行</span></label>
          <label><input type="radio" name="win" value="上午"><span>上午</span></label>
          <label><input type="radio" name="win" value="下午"><span>下午</span></label>
          <label><input type="radio" name="win" value="晚上"><span>晚上</span></label>
        </div>
        <div class="sk" style="margin-top:8px">选填。不选就按全天算——师傅会按楼栋顺序上门，不单独等你。</div>
      </div>
    </div>

    <div class="card">
      <div class="hd"><h2>位置</h2></div>
      <div class="rows" style="border-top:1px solid var(--line)">
        <div class="row"><div class="k">楼栋</div><div class="v" id="bName">—</div></div>
        <div class="row"><div class="k">寝室</div><div class="v" id="rName">—</div></div>
        <div class="row"><div class="k">报修人</div><div class="v" id="me">—</div></div>
      </div>
      <div class="ft">位置按学籍自动带出，不用填。</div>
    </div>

    <div class="note"><span class="i">i</span><div>
      <b>紧急程度不用你选。</b>系统看描述自己判：涉及漏水、漏电这类有安全风险的直接定紧急；
      判断没把握就往上抬一档，不会压着不办。
    </div></div>

    <div class="note" data-tone="info"><span class="i">✓</span><div>
      提交之后这单会自己排队、自己派给本楼师傅，你不用催，也不用再打电话。
    </div></div>
  </main>

  <div class="actions">
    <button class="btn primary big block" id="submit" disabled>提交报修</button>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
(async function () {
  let meta, user;
  try { ({ meta, user } = await App.start('student')); }
  catch (e) { document.body.innerHTML = '<div class="empty">启动失败：' + App.esc(App.explainErr(e)) + '</div>'; return; }

  const b = meta.buildings.find(x => x.id === user.building);
  App.$('#loc').textContent = (b ? b.name : '未绑定') + ' ' + (user.room || '');
  App.$('#bName').textContent = b ? b.name : '未绑定';
  App.$('#rName').textContent = user.room || '未绑定';
  App.$('#me').textContent = user.name;

  // 时段：值用 meta 里的完整字符串（带时间），显示只取"全天/上午"这几个字
  const shortWin = w => String(w).split(/[（(]/)[0];
  App.$('#win').innerHTML = meta.windows.map((w, i) =>
    `<label><input type="radio" name="win" value="${App.esc(w)}" ${i === 0 ? 'checked' : ''}><span>${App.esc(shortWin(w) === '全天' ? '全天都行' : shortWin(w))} <i style="font-style:normal;color:var(--ink-3);font-size:11.5px">${App.esc((String(w).match(/[（(](.+?)[）)]/) || [])[1] || '')}</i></span></label>`
  ).join('');

  const photos = [];
  const up = App.$('#up'), thumbs = App.$('#thumbs'), desc = App.$('#desc'), btn = App.$('#submit');

  function paint() {
    App.$('#phCnt').textContent = photos.length ? photos.length + ' 张' : '没拍';
    App.$('#phHint').style.display = photos.length ? 'none' : '';
    thumbs.innerHTML = photos.map((p, i) =>
      `<div class="ph ok">${App.esc(p.label)}<button data-del="${i}" aria-label="删掉">×</button></div>`).join('');
    App.$('#dCnt').textContent = desc.value.trim().length + ' / 200';
    btn.disabled = !(photos.length > 0 && desc.value.trim().length >= 4);
    btn.textContent = !photos.length ? '先拍一张照片'
      : (desc.value.trim().length < 4 ? '再写一句（至少 4 个字）' : '提交报修');
  }

  up.addEventListener('click', () => {
    if (photos.length >= 3) return App.toast('最多 3 张，够了');
    photos.push({ label: '现场照 ' + (photos.length + 1) + '.jpg', url: 'demo://photo/' + Date.now() + '-' + photos.length });
    paint();
  });

  thumbs.addEventListener('click', ev => {
    const d = ev.target.closest('[data-del]');
    if (!d) return;
    photos.splice(+d.getAttribute('data-del'), 1);
    paint();
  });

  desc.addEventListener('input', paint);
  paint();

  btn.addEventListener('click', async () => {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '正在提交…';
    const win = (App.$('input[name=win]:checked') || {}).value || '全天';
    try {
      const o = await App.api.post('/orders', {
        desc: desc.value.trim(),
        photoUrls: photos.map(p => p.url),
        window: win
      }, { role: 'student' });

      // 提交后立刻自动派工（本楼有当班师傅就派）
      try { await App.api.post('/orders/' + encodeURIComponent(o.no) + '/assign', {}, { role: 'system' }); } catch (e) {}

      const s = App.sheet({
        title: '报好了',
        sub: '单号 ' + o.no,
        body: `
          <div class="rows" style="border:1px solid var(--line);border-radius:12px;overflow:hidden">
            <div class="row"><div class="k">故障类型</div><div class="v">${App.esc(o.ai.category)}</div></div>
            <div class="row"><div class="k">紧急程度</div><div class="v">${App.levelPill(o.ai.level)}</div></div>
            <div class="row"><div class="k">可上门</div><div class="v">${App.esc(win)}</div></div>
            <div class="row"><div class="k">现在状态</div><div class="v">${App.statusPill(o.status)}</div></div>
          </div>
          <div class="note" data-tone="info" style="margin:12px 0 0"><span class="i">AI</span><div>
            <b>系统为什么这么判：</b>${App.esc(o.ai.basis)}
            <div class="sk" style="margin-top:4px">置信度 ${(o.ai.confidence * 100).toFixed(0)}%${o.ai.fallback ? '（没认准，按保守档处理）' : ''}</div>
          </div></div>
          <div class="actions" style="position:static;margin:16px -16px -16px;padding:12px 16px">
            <a class="btn ghost block" href="index.html">回首页</a>
            <a class="btn primary block" href="detail.html?no=${encodeURIComponent(o.no)}">看这单</a>
          </div>`
      });
    } catch (e) {
      App.toast(App.explainErr(e), 'bad');
      btn.disabled = false;
      paint();
    }
  });
})();
</script>
</body>
</html>
