<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>我的报修 · 宿舍维修</title>
<link rel="stylesheet" href="/assets/ui.css">
</head>
<body>
<div class="stage">
  <header class="top">
    <div><h1>我的报修</h1><div class="sub" id="sub">—</div></div>
    <div class="grow"></div>
    <div id="who"></div>
  </header>

  <div class="seg" id="tabs" style="margin:12px 18px 0">
    <button class="on" data-tab="ACTIVE">进行中</button>
    <button data-tab="DONE">已完工</button>
    <button data-tab="ALL">全部</button>
  </div>

  <main class="body" id="list"></main>
</div>

<script src="/assets/app.js"></script>
<script>
(async function () {
  let meta, user;
  try { ({ meta, user } = await App.start('student')); }
  catch (e) { document.body.innerHTML = '<div class="empty">启动失败：' + App.esc(App.explainErr(e)) + '</div>'; return; }

  App.$('#sub').textContent = (meta.buildings.find(b => b.id === user.building) || {}).name + ' ' + (user.room || '');
  App.$('#who').innerHTML = App.whoBar('student', user);
  App.bindWho(document, 'student');
  App.nav('student', 'list.html');

  const list = App.$('#list');
  let tab = new URLSearchParams(location.search).get('tab') || 'ACTIVE';

  function ticket(o) {
    const t = o.timers || {};
    const tl = t.t1 || t.t2;
    const tone = t.t1 ? (t.t1.leftMs < 24 * App.HOUR ? 'danger' : 'warn') : '';
    return `<a class="ticket" data-st="${App.esc(o.status)}" href="detail.html?no=${encodeURIComponent(o.no)}">
      <div class="l1"><span class="no">${App.esc(o.no)}</span><div class="grow"></div>${App.statusPill(o.status)}</div>
      <div class="d">${App.esc(o.desc)}</div>
      <div class="m">
        <span>${App.esc(o.room)} 室</span><span class="dot">·</span>
        <span>${App.esc(o.category)}</span><span class="dot">·</span>
        ${App.levelPill(o.level)}
      </div>
      ${tl ? `<div class="meterline" data-tone="${tone}">
        <span>${App.tlabel(tl)}</span><div class="grow"></div>
        <span style="color:${tone === 'danger' ? 'var(--danger)' : 'var(--ink-2)'}">${App.short(tl.leftMs)}</span>
      </div>` : ''}
    </a>`;
  }

  async function load() {
    App.$$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    list.innerHTML = `<div class="empty">加载中…</div>`;
    try {
      const r = await App.api.get('/my/orders?status=' + tab + '&pageSize=50', { role: 'student' });
      const items = r.items || [];
      if (!items.length) {
        list.innerHTML = tab === 'ACTIVE'
          ? `<div class="empty"><div class="big">手上没有在跑的单</div>有事就报一张，30 秒的事</div>`
          : `<div class="empty"><div class="big">这里还是空的</div>报过的单会落在这儿</div>`;
        return;
      }
      list.innerHTML = items.map(ticket).join('');
    } catch (e) {
      list.innerHTML = `<div class="empty">${App.esc(App.explainErr(e))}</div>`;
    }
  }

  App.$('#tabs').addEventListener('click', ev => {
    const b = ev.target.closest('[data-tab]');
    if (!b) return;
    tab = b.dataset.tab;
    history.replaceState(null, '', '?tab=' + tab);
    load();
  });

  await load();
})();
</script>
</body>
</html>
