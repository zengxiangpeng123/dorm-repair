<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>工单详情 · 宿舍维修</title>
<link rel="stylesheet" href="/assets/ui.css">
</head>
<body>
<div class="stage">
  <header class="top">
    <a class="back" href="list.html" aria-label="返回">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div><h1 id="no">工单</h1><div class="sub" id="st">—</div></div>
    <div class="grow"></div>
    <div id="top-pill"></div>
  </header>

  <main class="body" id="main" style="padding-bottom:120px">
    <div class="empty">加载中…</div>
  </main>
</div>

<script src="/assets/app.js"></script>
<script>
(async function () {
  let meta, user;
  try { ({ meta, user } = await App.start('student')); }
  catch (e) { document.body.innerHTML = '<div class="empty">启动失败：' + App.esc(App.explainErr(e)) + '</div>'; return; }

  const no = new URLSearchParams(location.search).get('no');
  const main = App.$('#main');
  if (!no) { main.innerHTML = '<div class="empty">没带单号</div>'; return; }
  App.$('#no').textContent = no;

  let o = null;

  async function load() {
    try {
      o = await App.api.get('/orders/' + encodeURIComponent(no), { role: 'student' });
    } catch (e) {
      main.innerHTML = `<div class="empty">${App.esc(App.explainErr(e))}</div>`;
      return;
    }
    App.$('#st').textContent = `${o.building} ${o.room} · ${o.category} · ${o.window}`;
    App.$('#top-pill').innerHTML = App.statusPill(o.status);
    render();
  }

  function render() {
    const t = o.timers || {};
    main.innerHTML = [
      headCard(),
      timerBlock(t),
      workerCard(),
      photoCard(),
      partsCard(),
      aiCard(),
      timelineCard(),
      chainCard()
    ].join('');

    main.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act)));
    startTick();
  }

  function headCard() {
    return `<div class="card">
      <div class="hd"><h2>这单什么情况</h2><div class="grow"></div>${App.levelPill(o.level)}</div>
      <div class="pd">
        <div style="font-size:15.5px;line-height:1.5">${App.esc(o.desc)}</div>
        <div style="margin:16px 0 4px">${App.steps(o)}</div>
        <div class="sk">提交于 ${App.when(o.createdAt)}　可上门：${App.esc(o.window)}</div>
      </div>
      ${actionBar()}
    </div>`;
  }

  function actionBar() {
    const st = o.status;
    if (st === 'PENDING' || (st === 'ASSIGNED' && !o.arriveAt)) {
      return `<div class="ft" style="display:flex;gap:10px;align-items:center">
        <span class="sk" style="flex:1">师傅还没进楼，现在还能直接撤</span>
        <button class="btn ghost" data-act="cancel">撤销报修</button>
      </div>`;
    }
    if (st === 'REPAIRING') {
      if (o.cancelRequest) {
        return `<div class="ft"><span class="sk">已申请撤销（${App.when(o.cancelRequest.at)}），等管理员处理。师傅已进楼，这单不能直接作废。</span></div>`;
      }
      return `<div class="ft" style="display:flex;gap:10px;align-items:center">
        <span class="sk" style="flex:1">师傅已在楼里，撤单要管理员点头</span>
        <button class="btn ghost" data-act="cancelRequest">申请撤销</button>
      </div>`;
    }
    if (st === 'PARTS') {
      return `<div class="ft"><span class="sk">等配件到货。到货后系统自动重新排队，紧急度不降。</span></div>`;
    }
    if (st === 'VERIFYING') {
      return `<div class="ft" style="display:flex;gap:10px">
        <button class="btn block" data-act="reject">还没修好</button>
        <button class="btn primary block" data-act="accept">确认修好并签字</button>
      </div>`;
    }
    const txt = {
      DONE: '已签字。满 7 天系统自动归档，归档后这单转只读。',
      CLOSED: '已归档，不能再改。这也是以后查账用的那张单。',
      CANCELLED: '这单已撤销，没有产生维修记录。',
      REWORKING: `验收没过，已生成返修单 ${App.esc(o.reworkNo || '')}，师傅会重新上门。`
    }[st] || '';
    return txt ? `<div class="ft"><span class="sk">${txt}</span></div>` : '';
  }

  function timerBlock(t) {
    const rows = [];
    if (t.t1) rows.push(t.t1);
    if (t.t2) rows.push(t.t2);
    if (!rows.length) return '';
    return `<div class="card">
      <div class="hd"><h2>倒计时</h2><div class="grow"></div><span class="sk">到点系统自己动手</span></div>
      <div class="pd" style="display:grid;gap:10px">
        ${rows.map(x => {
          const tone = x.leftMs < 24 * App.HOUR ? 'danger' : (x.leftMs < 72 * App.HOUR ? 'warn' : '');
          return `<div class="timer" data-tone="${tone}" data-deadline="${App.parse(x.deadline)}">
            <div class="grow"><div class="lb">${App.esc(x.label)}</div><div class="big" data-left>${App.short(x.leftMs)}</div></div>
            <div style="text-align:right"><div class="lb">截止</div><div class="sk">${App.when(x.deadline)}</div></div>
          </div>`;
        }).join('')}
      </div>
      <div class="ft">${t.t1 ? '超时没验收，系统按“确认修好”处理，不扣你分也不影响再报修。' : '签字之后才开始算归档时间。'}</div>
    </div>`;
  }

  function workerCard() {
    if (!o.worker) {
      return `<div class="card"><div class="hd"><h2>谁在处理</h2></div>
        <div class="pd"><div class="sk">正在按楼栋排单，派到师傅会显示在这儿。</div></div></div>`;
    }
    const marks = [
      ['派工', o.assignedAt], ['到门打卡', o.arriveAt], ['完工', o.finishAt]
    ].filter(x => x[1]);
    return `<div class="card">
      <div class="hd"><h2>谁在处理</h2><div class="grow"></div><span class="pill plain">${App.esc(o.worker.team || '维修班')}</span></div>
      <div class="rows" style="border-top:1px solid var(--line)">
        <div class="row"><div class="k">师傅</div><div class="v">${App.esc(o.worker.name)}</div></div>
        ${marks.map(([k, v]) => `<div class="row"><div class="k">${k}</div><div class="v">${App.when(v)}</div></div>`).join('')}
      </div>
      ${o.noShowCount ? `<div class="ft"><span class="sk">到访未遇 ${o.noShowCount} 次，已自动重排</span></div>` : ''}
    </div>`;
  }

  function photoCard() {
    const before = o.photosBefore || [], after = o.photosAfter || [];
    const needAfter = ['VERIFYING', 'DONE', 'CLOSED'].includes(o.status);
    const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3"/></svg>';
    const WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg>';
    const afterHtml = after.length
      ? after.map((p, i) => `<div class="ph ok">${CAM}完工照 ${i + 1}</div>`).join('')
      : (needAfter
        ? `<div class="ph bad">${WARN}没有完工照</div>`
        : `<div class="ph">${CAM}等师傅上传</div>`);
    return `<div class="card">
      <div class="hd"><h2>照片</h2><div class="grow"></div><span class="sk">${before.length} 张现场 · ${after.length} 张完工</span></div>
      <div class="pd">
        <div class="sk" style="margin-bottom:6px">你拍的</div>
        <div class="thumbs">${before.map((p, i) => `<div class="ph ok">${CAM}现场照 ${i + 1}</div>`).join('') || `<div class="ph bad">${WARN}缺现场照</div>`}</div>
        <div class="sk" style="margin:12px 0 6px">师傅拍的</div>
        <div class="thumbs">${afterHtml}</div>
      </div>
      ${needAfter && !after.length ? `<div class="ft"><span class="sk" style="color:var(--danger)">状态已经到「${App.STATUS_TEXT[o.status]}」但一张完工照都没有——这单会被列进管理端例外清单。</span></div>` : ''}
    </div>`;
  }

  function partsCard() {
    if (!o.parts) return '';
    const st = o.parts.status === 'ARRIVED' ? '已到货' : '等到货';
    return `<div class="card">
      <div class="hd"><h2>缺的配件</h2><div class="grow"></div><span class="pill plain">${st}</span></div>
      <div class="rows" style="border-top:1px solid var(--line)">
        <div class="row"><div class="k">名称</div><div class="v">${App.esc(o.parts.name)}</div></div>
        <div class="row"><div class="k">金额</div><div class="v">¥ ${App.esc(o.parts.amount)}</div></div>
        <div class="row"><div class="k">预计到货</div><div class="v">${App.esc(o.parts.etaDate || '—')}</div></div>
      </div>
      <div class="ft">${o.parts.amount > meta.budgetLine
        ? `超过 ${meta.budgetLine} 元预算线，要走管理端审批，已经挂进例外清单。`
        : `${meta.budgetLine} 元以内，师傅可以直接领，不用你签字。`}</div>
    </div>`;
  }

  function aiCard() {
    const ai = o.ai || {};
    return `<div class="card">
      <div class="hd"><h2>系统怎么判的</h2><div class="grow"></div><span class="sk">不可修改</span></div>
      <div class="rows" style="border-top:1px solid var(--line)">
        <div class="row"><div class="k">故障类型</div><div class="v">${App.esc(ai.category || '—')}</div></div>
        <div class="row"><div class="k">紧急程度</div><div class="v">${App.levelPill(ai.level || o.level)}</div></div>
        <div class="row"><div class="k">置信度</div><div class="v">${ai.confidence != null ? (ai.confidence * 100).toFixed(0) + '%' : '—'}</div></div>
      </div>
      <div class="pd" style="padding-top:12px"><div class="sk">${App.esc(ai.basis || '')}</div></div>
      <div class="ft">判错了也不影响派工——系统按保守档往上抬，不会因为判错把单压下来。</div>
    </div>`;
  }

  function timelineCard() {
    const evs = (o.events || []).slice().sort((a, b) => a.seq - b.seq);
    return `<div class="card">
      <div class="hd"><h2>全链路</h2><div class="grow"></div><span class="sk">${evs.length} 条记录</span></div>
      <div class="pd">
        <div class="tl">
          ${evs.map((e, i) => {
            const last = i === evs.length - 1;
            return `<div class="ev" data-s="${last ? 'now' : 'done'}">
              <div class="dot"></div>
              <div class="c">
                <div class="t1">${App.esc(App.EVENT_CN[e.event] || e.event)}
                  ${e.manual === 0 ? '<span class="pill plain" style="margin-left:6px;font-size:10.5px">系统自动</span>' : ''}</div>
                <div class="t2">${App.when(e.at)} · ${App.esc(e.actorName || '')}${e.note ? '　' + App.esc(e.note) : ''}</div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="ft">这条时间线谁也改不了——以后有人说“报了三次没人管”，翻的就是这里。</div>
    </div>`;
  }

  function chainCard() {
    const chain = o.chain || [];
    if (chain.length < 2) return '';
    return `<div class="card">
      <div class="hd"><h2>返修链</h2><div class="grow"></div><span class="sk">同一件事的 ${chain.length} 张单</span></div>
      <div class="rows" style="border-top:1px solid var(--line)">
        ${chain.map(x => `<a class="row" href="detail.html?no=${encodeURIComponent(x.no)}" style="text-decoration:none;color:inherit">
          <div class="k" style="width:130px">${App.esc(x.no)}</div>
          <div class="v" style="text-align:right">${App.statusPill(x.status)}</div>
        </a>`).join('')}
      </div>
      <div class="ft">返修超过 2 次，管理端会盯上这张单——问题一般不在师傅手上。</div>
    </div>`;
  }

  function startTick() {
    setInterval(() => {
      App.$$('[data-deadline]').forEach(el => {
        const left = +el.getAttribute('data-deadline') - Date.now();
        const t = App.$('[data-left]', el);
        if (t) t.textContent = App.short(left);
      });
    }, 1000);
  }

  /* ---------------- 动作 ---------------- */

  async function act(name) {
    if (name === 'cancel') {
      const s = App.sheet({
        title: '撤销这单？',
        sub: '师傅还没进楼，撤了不产生任何记录。',
        body: `<div class="actions" style="position:static;margin:8px 0 0;padding:0">
          <button class="btn ghost block" data-x="no">算了</button>
          <button class="btn danger block" data-x="yes">确认撤销</button></div>`
      });
      s.el.addEventListener('click', async ev => {
        const x = ev.target.closest('[data-x]');
        if (!x) return;
        if (x.dataset.x === 'no') return s.close();
        try {
          await App.api.post('/orders/' + encodeURIComponent(no) + '/cancel', { version: o.version }, { role: 'student' });
          s.close(); App.toast('已撤销'); await load();
        } catch (e) { App.toast(App.explainErr(e), 'bad'); }
      });
      return;
    }

    if (name === 'cancelRequest') {
      const s = App.sheet({
        title: '申请撤销',
        sub: '师傅已经进楼了。这条会进管理端例外清单，由管理员决定作废还是补偿师傅。',
        body: `<textarea class="input" id="crReason" rows="3" placeholder="例：我已经自己修好了 / 我报错了寝室"></textarea>
          <button class="btn primary block big" style="margin-top:12px" data-x="ok">提交申请</button>`
      });
      s.el.addEventListener('click', async ev => {
        if (!ev.target.closest('[data-x="ok"]')) return;
        try {
          await App.api.post('/orders/' + encodeURIComponent(no) + '/cancel-request',
            { reason: App.$('#crReason', s.el).value.trim() }, { role: 'student' });
          s.close(); App.toast('申请已提交，等管理员处理'); await load();
        } catch (e) { App.toast(App.explainErr(e), 'bad'); }
      });
      return;
    }

    if (name === 'reject') {
      const s = App.sheet({
        title: '哪儿还没修好',
        sub: '提交后会生成一张返修单，紧急度自动升一档，师傅重新上门。',
        body: `<textarea class="input" id="rjReason" rows="3" placeholder="例：还在渗水，接了一晚上还是满的"></textarea>
          <button class="btn primary block big" style="margin-top:12px" data-x="ok">提交返修</button>`
      });
      s.el.addEventListener('click', async ev => {
        if (!ev.target.closest('[data-x="ok"]')) return;
        try {
          const r = await App.api.post('/orders/' + encodeURIComponent(no) + '/reject',
            { reason: App.$('#rjReason', s.el).value.trim(), version: o.version }, { role: 'student' });
          s.close(); App.toast('已转返修 ' + (r.reworkNo || ''));
          location.href = 'detail.html?no=' + encodeURIComponent(r.reworkNo || no);
        } catch (e) { App.toast(App.explainErr(e), 'bad'); }
      });
      return;
    }

    if (name === 'accept') {
      const s = App.sheet({
        title: '确认修好并签字',
        sub: '签完这单就结束了，7 天后自动归档。',
        body: `<div class="rows" style="border:1px solid var(--line);border-radius:12px;overflow:hidden">
            <div class="row"><div class="k">签字人</div><div class="v">${App.esc(user.name)}</div></div>
            <div class="row"><div class="k">签字时间</div><div class="v">${App.clock(Date.now())}</div></div>
          </div>
          <button class="btn primary block big" style="margin-top:12px" data-x="ok">签好了</button>`
      });
      s.el.addEventListener('click', async ev => {
        if (!ev.target.closest('[data-x="ok"]')) return;
        try {
          await App.api.post('/orders/' + encodeURIComponent(no) + '/accept', { version: o.version }, { role: 'student' });
          s.close(); App.toast('已签字'); await load();
        } catch (e) { App.toast(App.explainErr(e), 'bad'); }
      });
      return;
    }
  }

  await load();
})();
</script>
</body>
</html>
