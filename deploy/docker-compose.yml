services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dorm_repair
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD required}
      MYSQL_USER: ${DB_USER:?DB_USER required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
      - ../app/server/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1g

  ai:
    build:
      context: ..
      dockerfile: deploy/ai/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env.production
        required: false

    expose: ["8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  server:
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env.production
        required: false
      - path: ../app/ai/.env.local
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: "3306"
      AI_SERVICE_URL: http://ai:8001
    expose: ["8082"]
    depends_on:
      mysql: { condition: service_healthy }
      ai: { condition: service_healthy }
    volumes:
      - uploads:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1g

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    expose: ["9090"]
    depends_on:
      server: { condition: service_healthy }
      ai: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 256m

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      server: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  mysql_data:
  uploads:
  prometheus_data:
