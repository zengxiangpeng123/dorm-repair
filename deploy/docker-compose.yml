services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dorm_repair
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD required}
      MYSQL_USER: ${DB_USER:?DB_USER required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
      - ../app/server/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1g

  ai:
    build:
      context: ..
      dockerfile: deploy/ai/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env.production
        required: false

    expose: ["8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  server:
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env.production
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: "3306"
      # server 容器内通过 ai:8001 访问模型服务；生产安全校验只拒绝本机回环地址。
      AI_SERVICE_URL: http://ai:8001
      APP_FILE_S3_ENDPOINT: ${APP_FILE_S3_ENDPOINT:-}
      APP_FILE_S3_REGION: ${APP_FILE_S3_REGION:-us-east-1}
      APP_FILE_S3_BUCKET: ${APP_FILE_S3_BUCKET:-}
      APP_FILE_S3_ACCESS_KEY: ${APP_FILE_S3_ACCESS_KEY:-}
      APP_FILE_S3_SECRET_KEY: ${APP_FILE_S3_SECRET_KEY:-}
      APP_FILE_S3_SESSION_TOKEN: ${APP_FILE_S3_SESSION_TOKEN:-}
      APP_FILE_S3_PATH_STYLE: ${APP_FILE_S3_PATH_STYLE:-false}
    expose: ["8082"]
    depends_on:
      mysql: { condition: service_healthy }
      ai: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1g

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    expose: ["9090"]
    depends_on:
      server: { condition: service_healthy }
      ai: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 256m

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    expose: ["9093"]
    deploy:
      resources:
        limits:
          memory: 128m

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      server: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  mysql_data:
  prometheus_data:
  alertmanager_data:
