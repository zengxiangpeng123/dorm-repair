upstream dorm_api {
  server server:8082;
  keepalive 16;
}
upstream dorm_ai {
  server ai:8001;
  keepalive 8;
}
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name _;
  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
  client_max_body_size 10m;
  location /api/ {
    proxy_pass http://dorm_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 35s;
  }
  location /actuator/health { proxy_pass http://dorm_api; }
  location = /actuator/prometheus { return 404; }
  location /metrics { return 404; }
  location = /student/ { return 302 /student/index.html; }
  location = /worker/ { return 302 /worker/index.html; }
  location = /admin/ { return 302 /admin/index.html; }
  location /student/ { alias /usr/share/nginx/html/student/; try_files $uri $uri/ /student/index.html; }
  location /worker/ { alias /usr/share/nginx/html/worker/; try_files $uri $uri/ /worker/index.html; }
  location /admin/ { alias /usr/share/nginx/html/admin/; try_files $uri $uri/ /admin/index.html; }
  location / { return 404; }
}
