global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: dorm-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["server:8082"]
  - job_name: dorm-ai
    metrics_path: /metrics
    static_configs:
      - targets: ["ai:8001"]
