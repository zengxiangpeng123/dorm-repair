global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        # Alertmanager is optional for local startup. Production must set a real receiver.
        - targets: []
scrape_configs:
  - job_name: dorm-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["server:8082"]
  - job_name: dorm-ai
    metrics_path: /metrics
    static_configs:
      - targets: ["ai:8001"]
