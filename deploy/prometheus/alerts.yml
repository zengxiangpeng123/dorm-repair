groups:
  - name: dorm-repair
    rules:
      - alert: DormServerDown
        expr: up{job="dorm-server"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "宿舍维修后端不可用"}
      - alert: DormAiDown
        expr: up{job="dorm-ai"} == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "AI 服务不可用，已进入规则兜底"}
      - alert: DormHttp5xx
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "后端 5xx 错误率升高"}
      - alert: DormHttpSlow
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "后端 P95 延迟超过 2 秒"}
